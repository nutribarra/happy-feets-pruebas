<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Feets · Prototipo</title><style>
:root{--bg:#f4f8f7;--card:#fff;--ink:#173332;--muted:#637b79;--teal:#087e75;--pale:#e1f3ee;--line:#dce8e5;--orange:#f7b55c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1100px;margin:auto;padding:22px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:13px;font-weight:800;font-size:23px;letter-spacing:-.6px}.logo{background:var(--teal);color:white;border-radius:17px;padding:10px;font-size:26px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:11px 16px;font-weight:650}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.soft{background:var(--pale);border-color:var(--pale);color:var(--teal)}.btn.warn{color:#a14c1d}.btn.small{padding:7px 11px;font-size:13px}.hero{border-radius:25px;background:linear-gradient(125deg,#076b65,#13a18c);color:white;padding:34px;display:grid;grid-template-columns:1fr 200px;align-items:center;gap:20px}.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.14;margin:8px 0}.hero p{max-width:570px;color:#e3f9f2}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.heroart{font-size:110px;text-align:center;filter:drop-shadow(0 10px 12px #044c4b55)}.section{margin-top:27px}.section h2{font-size:22px;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:21px;box-shadow:0 6px 20px #103e3210}.choice{cursor:pointer;transition:.2s}.choice:hover{transform:translateY(-3px);border-color:#91cbc0}.choice .emoji{font-size:35px}.choice h3{margin:10px 0 4px}.choice p{color:var(--muted);margin:0}.muted{color:var(--muted)}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:17px}.headrow h1{font-size:27px;margin:0}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-weight:650;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink)}.segment{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 17px}.segment button.active{background:var(--teal);color:white;border-color:var(--teal)}.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.checkitem{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px;background:white}.checkitem input{accent-color:var(--teal);width:17px;height:17px}.checkitem span{flex:1}.checkitem small{color:var(--muted)}.footeractions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{display:inline-block;border-radius:30px;background:var(--pale);color:var(--teal);font-size:12px;font-weight:700;padding:5px 10px}.stepper{height:9px;background:#e0e9e7;border-radius:20px;overflow:hidden;margin:13px 0}.stepper div{height:100%;background:var(--teal);transition:width .3s}.assessment{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(270px,.9fr);gap:18px}.camera{position:relative;background:linear-gradient(150deg,#153d3c,#081d22);border-radius:20px;min-height:390px;display:flex;align-items:center;justify-content:center;color:#ddf8f0;overflow:hidden}.camera svg{width:200px;height:300px}.camlabel{position:absolute;top:14px;left:14px;background:#ffffff24;border-radius:30px;padding:6px 11px;font-size:12px}.camfoot{position:absolute;bottom:14px;left:14px;right:14px;font-size:12px;color:#b9d9d2;text-align:center}.measure{font-size:55px;font-weight:800;line-height:1.1}.tip{border-radius:12px;background:#f1f8f5;padding:13px;color:#285c53}.warning{background:#fff5e6;color:#805a20;padding:12px;border-radius:12px;font-size:13px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f2f8f6;padding:13px;border-radius:13px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:11px 8px;text-align:left;font-size:13px}th{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}.tag{background:#eef4f2;border-radius:20px;padding:3px 9px;font-size:12px}.hidden{display:none!important}.tiny{font-size:12px}.toggle{display:flex;gap:10px;align-items:center;padding:9px 0}.toggle input{accent-color:var(--teal)}@media(max-width:700px){.app{padding:13px 13px 50px}.top{align-items:flex-start}.brand{font-size:19px}.nav{gap:4px}.nav .btn{font-size:12px;padding:8px}.hero{grid-template-columns:1fr;padding:25px}.heroart{display:none}.grid,.formrow,.checklist,.assessment{grid-template-columns:1fr}.camera{min-height:300px}.card{padding:17px}.statgrid{grid-template-columns:repeat(3,1fr)}.stat strong{font-size:17px}}
@media print{.top,.footeractions,.btn,.no-print{display:none!important}body{background:white}.app{max-width:none}.card{box-shadow:none} }

/* Apariencia adaptable a colores claros y oscuros */
:root.dark-bg{--card:#172528;--ink:#f0f8f7;--muted:#b0c5c3;--teal:#61d7c4;--pale:#203b3b;--line:#365154}
.dark-bg .btn{background:#24383b;color:var(--ink);border-color:var(--line)}
.dark-bg .btn.primary{background:#0b8176;color:#fff;border-color:#0b8176}
.dark-bg .btn.soft,.dark-bg .pill{background:#23433f;color:#8de7d7;border-color:#23433f}
.dark-bg .field input,.dark-bg .field textarea,.dark-bg .field select,.dark-bg .checkitem{background:#203235;color:var(--ink);border-color:var(--line)}
.dark-bg .tip,.dark-bg .stat,.dark-bg .tag{background:#203638;color:var(--ink)}
.dark-bg .warning{background:#463624;color:#ffe2ad}

.dark-bg .muted,.dark-bg th,.dark-bg .choice p,.dark-bg .checkitem small,.dark-bg .stat span{color:var(--muted)}
.dark-bg .hero{background:linear-gradient(125deg,#07574f,#086e67)}
.dark-bg .hero .btn{background:#fff;color:#173332}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">👣</div><span>Happy Feets</span></div><nav class="nav"><button class="btn small" onclick="home()">Inicio</button><button class="btn small" onclick="historyView()">Historial</button><button class="btn small" onclick="settingsView()">⚙ Ajustes</button></nav></header><main id="main"></main></div><script>
const MOVES=[{id:'df',joint:'Tobillo',name:'Dorsiflexión en carga',sides:['Derecha','Izquierda'],view:'Lateral'},{id:'fpb',joint:'Tobillo',name:'Flexión plantar bilateral',sides:['Bilateral'],view:'Lateral'},{id:'fpu',joint:'Tobillo',name:'Flexión plantar unilateral',sides:['Derecha','Izquierda'],view:'Lateral'},{id:'kf',joint:'Rodilla',name:'Flexión',sides:['Derecha','Izquierda'],view:'Lateral'},{id:'ke',joint:'Rodilla',name:'Extensión',sides:['Derecha','Izquierda'],view:'Lateral'},{id:'hf',joint:'Cadera',name:'Flexión',sides:['Derecha','Izquierda'],view:'Lateral'},{id:'he',joint:'Cadera',name:'Extensión',sides:['Derecha','Izquierda'],view:'Lateral'},{id:'ha',joint:'Cadera',name:'Abducción',sides:['Derecha','Izquierda'],view:'Frontal'},{id:'hd',joint:'Cadera',name:'Aducción anterior',sides:['Derecha','Izquierda'],view:'Frontal'}];
const $=id=>document.getElementById(id), html=s=>$('main').innerHTML=s;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='happy_feets_proto_v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{sessions:[],settings:{reps:3,countdown:true,seconds:3,sound:false,guide:true,alerts:true}}}catch(e){db={sessions:[],settings:{reps:3,countdown:true,seconds:3,sound:false,guide:true,alerts:true}}}if(!Number.isFinite(+db.settings.compensationAngle))db.settings.compensationAngle=10;
function save(){localStorage.setItem(key,JSON.stringify(db))}function validBg(v){return /^#[0-9a-fA-F]{6}$/.test(v||'')?v:'#f4f8f7'}function setBackground(v){db.settings.background=validBg(v);document.documentElement.style.setProperty('--bg',db.settings.background);const c=db.settings.background.slice(1);const rgb=[0,2,4].map(i=>parseInt(c.slice(i,i+2),16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);const luminance=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];document.documentElement.classList.toggle('dark-bg',luminance<.22);save();let label=document.getElementById('bgHex');if(label)label.textContent=db.settings.background.toUpperCase();let picker=document.getElementById('bgPicker');if(picker)picker.value=db.settings.background}setBackground(db.settings.background||'#f4f8f7');let draft=null,session=null,index=0,rep=0,phase='ready',reptimes=[],timer=null;function stopTimer(){if(timer){clearInterval(timer);timer=null}}function tasks(){return MOVES.flatMap(m=>m.sides.map(side=>({id:m.id+':'+side,move:m,side,reps:db.settings.reps})))}function home(){stopTimer();html(`<div class="hero"><div><span class="eyebrow">Movilidad funcional · Extremidades inferiores</span><h1>Conoce tu movimiento.<br>Explora tu progreso.</h1><p>Evalúa tobillo, rodilla y cadera con recorridos guiados, compara ambos lados y conserva tus resultados.</p><button class="btn" onclick="configure('full')">Comenzar evaluación completa →</button></div><div class="heroart">🦵</div></div><section class="section"><h2>¿Qué deseas evaluar?</h2><div class="grid"><article class="card choice" onclick="configure('full')"><div class="emoji">📋</div><h3>Evaluación completa</h3><p>Todos los movimientos, de tobillo a cadera.</p></article><article class="card choice" onclick="configure('custom')"><div class="emoji">🎛️</div><h3>Personalizada</h3><p>Elige movimientos y lados. Orden automático.</p></article><article class="card choice" onclick="configure('single')"><div class="emoji">🎯</div><h3>Individual</h3><p>Una prueba específica, sin recorrido adicional.</p></article></div></section><section class="section"><div class="headrow"><h2>Evaluaciones recientes</h2><button class="btn small" onclick="historyView()">Ver historial →</button></div>${db.sessions.length?db.sessions.slice().reverse().slice(0,3).map(s=>`<div class="card" style="margin-bottom:9px"><strong>${esc(s.label||'Evaluación sin nombre')}</strong><div class="muted tiny">${new Date(s.created).toLocaleString('es-CL')} · ${esc(s.status)} · ${s.results.length} pruebas registradas</div><button class="btn small soft" style="margin-top:8px" onclick="resultsView('${s.id}')">Ver resultados</button></div>`).join(''):'<div class="card muted">Aún no hay evaluaciones guardadas. Puedes probar una simulación y guardar sus resultados.</div>'}</section><p class="tiny muted section">Prototipo de navegación. No utiliza la cámara ni mide ángulos reales. No apto para diagnóstico clínico.</p>`)}
function configure(type){stopTimer();draft={type,selected:type==='full'?tasks().map(t=>t.id):[],label:'',description:'',repMode:'general',reps:db.settings.reps,per:{}};configView()}function configView(){let all=tasks(),single=draft.type==='single';html(`<div class="headrow"><div><span class="eyebrow muted">Nueva evaluación</span><h1>${draft.type==='full'?'Evaluación completa':single?'Evaluación individual':'Evaluación personalizada'}</h1></div><button class="btn" onclick="home()">← Volver</button></div><div class="card"><div class="formrow"><div class="field"><label>Nombre o código (opcional)</label><input id="label" placeholder="Ej. Evaluación inicial" value="${esc(draft.label)}" oninput="draft.label=this.value"></div><div class="field"><label>Descripción (opcional)</label><input id="desc" placeholder="Ej. Seguimiento de movilidad" value="${esc(draft.description)}" oninput="draft.description=this.value"></div></div><h3>Selecciona las pruebas</h3><p class="muted tiny">El orden será automático: tobillo → rodilla → cadera; agrupando orientaciones de cámara.</p><div class="checklist">${all.map(t=>`<label class="checkitem"><input type="checkbox" ${draft.selected.includes(t.id)?'checked':''} ${draft.type==='full'?'disabled':''} onchange="pick('${t.id}',this.checked)"><span><strong>${esc(t.move.joint)} · ${esc(t.move.name)}</strong><br><small>${esc(t.side)} · Vista ${esc(t.move.view.toLowerCase())}</small></span></label>`).join('')}</div><h3>Repeticiones</h3><div class="segment"><button class="btn ${draft.repMode==='general'?'active':''}" onclick="draft.repMode='general';configView()">Mismas para todas</button><button class="btn ${draft.repMode==='individual'?'active':''}" onclick="draft.repMode='individual';configView()">Por prueba</button></div>${draft.repMode==='general'?`<div class="field" style="max-width:220px"><label>Repeticiones por prueba</label><input type="number" min="1" max="20" value="${draft.reps}" onchange="draft.reps=Math.max(1,Math.min(20,+this.value||3))"></div>`:`<div class="checklist">${all.filter(t=>draft.selected.includes(t.id)).map(t=>`<div class="field"><label>${esc(t.move.name)} · ${esc(t.side)}</label><input type="number" min="1" max="20" value="${draft.per[t.id]||draft.reps}" onchange="draft.per['${t.id}']=Math.max(1,Math.min(20,+this.value||3))"></div>`).join('')}</div>`}<div class="footeractions"><button class="btn primary" ${draft.selected.length?'':'disabled'} onclick="startSession()">Iniciar recorrido (${draft.selected.length} pruebas) →</button></div></div>`)}function pick(id,checked){if(draft.type==='single'){draft.selected=checked?[id]:[]}else{draft.selected=checked?[...draft.selected,id]:draft.selected.filter(x=>x!==id)}configView()}
function startSession(){let selected=tasks().filter(t=>draft.selected.includes(t.id)).map(t=>({...t,reps:draft.repMode==='general'?draft.reps:(draft.per[t.id]||draft.reps)}));if(!selected.length)return;session={id:'hf_'+Date.now(),created:new Date().toISOString(),updated:new Date().toISOString(),label:draft.label,description:draft.description,status:'En curso',type:draft.type,tests:selected.map(t=>({id:t.id,moveId:t.move.id,joint:t.move.joint,name:t.move.name,side:t.side,view:t.move.view,reps:t.reps})),results:[]};index=0;rep=0;phase='ready';hfPreparationView()}
const skeleton=`<svg viewBox="0 0 200 310" aria-label="Esqueleto de referencia ilustrativo"><circle cx="100" cy="43" r="17" fill="none" stroke="#75dbc6" stroke-width="5"/><g fill="none" stroke="#75dbc6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M100 61 L100 145 M100 80 L65 132 L62 167 M100 80 L136 131 L140 167 M100 145 L77 213 L78 282 M100 145 L121 214 L121 282"/></g><g fill="#b6fff1">${[[100,80],[100,145],[77,213],[121,214],[78,282],[121,282]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5"/>`).join('')}</g></svg>`;function assessmentView(){stopTimer();let t=session.tests[index];if(!t){finishSession('Completada');return}let pct=Math.round(100*index/session.tests.length);html(`<div class="headrow"><div><span class="eyebrow muted">${esc(session.label||'Evaluación en curso')}</span><h1>${esc(t.joint)} · ${esc(t.name)}</h1><span class="pill">${esc(t.side)} · Vista ${esc(t.view.toLowerCase())}</span></div><button class="btn" onclick="exitDialog()">⏸ Pausar / Salir</button></div><div class="muted tiny">Prueba ${index+1} de ${session.tests.length} · ${pct}% completado</div><div class="stepper"><div style="width:${pct}%"></div></div><div class="assessment"><div class="camera"><div class="camlabel">◉ Simulación · Sin cámara</div>${db.settings.guide?skeleton:'<div style="font-size:85px">🧍</div>'}<div class="camfoot">En la versión funcional aparecerán la cámara, el esqueleto detectado y la guía de postura.</div></div><div class="card"><div class="pill" id="phaseLabel">Preparación</div><h2 id="phaseTitle">Colócate en posición inicial</h2><p id="phaseInfo" class="muted">Vista ${esc(t.view.toLowerCase())}. Comprueba que se vean las articulaciones necesarias. El inicio automático será implementado con detección de postura.</p><div class="tip">🦴 Esqueleto de referencia: posición orientativa. El movimiento será guiado antes de medir.</div><div style="margin:17px 0"><span class="muted tiny">Repeticiones</span><div class="measure" id="repLabel">${rep} / ${t.reps}</div></div><div class="footeractions"><button class="btn primary" id="simulateBtn" onclick="simulateRep()">Simular repetición →</button><button class="btn soft" onclick="toggleGuide()">${db.settings.guide?'Ocultar':'Mostrar'} guía</button></div><div class="footeractions"><button class="btn" onclick="skipTest()">Omitir prueba</button><button class="btn" onclick="exitDialog()">Guardar / Finalizar</button></div><p class="warning" style="margin-top:20px">Los valores de esta demostración serán ficticios. No se realiza medición de ROM ni detección de compensaciones.</p></div></div>`)}function toggleGuide(){db.settings.guide=!db.settings.guide;save();assessmentView()}function simulateRep(){let t=session.tests[index];rep++;let base={df:34,fpb:28,fpu:27,kf:118,ke:28,hf:90,he:21,ha:35,hd:19}[t.moveId]||40;let value=Math.max(1,base+Math.round((Math.random()-.5)*13));reptimes.push({rep,rom:value,pre:Math.max(1,value-Math.round(Math.random()*6)),duration: +(2+Math.random()*2).toFixed(1)});$('repLabel').textContent=rep+' / '+t.reps;$('phaseLabel').textContent='Repetición simulada';$('phaseTitle').textContent='ROM ilustrativo: '+value+'°';$('phaseInfo').textContent='Registro de ejemplo · Puedes descansar antes de continuar.';if(rep>=t.reps){$('simulateBtn').textContent='Guardar y continuar →';$('simulateBtn').onclick=completeTest}}function completeTest(){let t=session.tests[index];session.results.push({...t,status:'Simulada',repetitions:reptimes.slice(),max:Math.max(...reptimes.map(x=>x.rom)),average:+(reptimes.reduce((a,x)=>a+x.rom,0)/reptimes.length).toFixed(1)});reptimes=[];rep=0;index++;phase='ready';assessmentView()}function skipTest(){let t=session.tests[index];session.results.push({...t,status:'No evaluado',repetitions:[],max:null,average:null});reptimes=[];rep=0;index++;assessmentView()}function exitDialog(){stopTimer();html(`<div class="card" style="max-width:620px;margin:auto"><h1>¿Qué deseas hacer?</h1><p class="muted">Las pruebas completadas se conservarán. Al retomar una sesión guardada, se deberá repetir la calibración.</p><div class="footeractions"><button class="btn primary" onclick="assessmentView()">Continuar ahora</button><button class="btn soft" onclick="finishSession('Pendiente')">Guardar y salir</button><button class="btn" onclick="finishPartial()">Finalizar parcialmente</button></div></div>`)}function finishPartial(){for(let i=index;i<session.tests.length;i++){let t=session.tests[i];session.results.push({...t,status:'No evaluado',repetitions:[],max:null,average:null})}finishSession('Finalizada parcialmente')}function finishSession(status){session.status=status;session.updated=new Date().toISOString();let old=db.sessions.findIndex(s=>s.id===session.id);if(old>=0)db.sessions[old]=session;else db.sessions.push(session);save();resultsView(session.id)}function historyView(){stopTimer();html(`<div class="headrow"><h1>Historial de evaluaciones</h1><button class="btn" onclick="home()">← Inicio</button></div><div class="card">${db.sessions.length?`<table><thead><tr><th>Fecha</th><th>Identificación</th><th>Estado</th><th></th></tr></thead><tbody>${db.sessions.slice().reverse().map(s=>`<tr><td>${new Date(s.created).toLocaleDateString('es-CL')}</td><td>${esc(s.label||'Sin nombre')}<div class="muted tiny">${s.results.length}/${s.tests.length} pruebas</div></td><td><span class="tag">${esc(s.status)}</span></td><td><button class="btn small soft" onclick="resultsView('${s.id}')">Abrir</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No hay evaluaciones registradas.</div>'}</div><p class="tiny muted">Los datos se guardan únicamente en este navegador mediante almacenamiento local.</p>`)}function resultsView(id){stopTimer();let s=db.sessions.find(x=>x.id===id);if(!s)return historyView();let vals=s.results.filter(x=>x.max!=null),pending=s.tests.length-s.results.length;html(`<div class="headrow"><div><span class="eyebrow muted">Resultados · ${esc(s.status)}</span><h1>${esc(s.label||'Evaluación sin nombre')}</h1><p class="muted">${new Date(s.created).toLocaleString('es-CL')} · ${esc(s.description||'Sin descripción')}</p></div><button class="btn" onclick="historyView()">← Historial</button></div><div class="card"><div class="statgrid"><div class="stat"><strong>${s.tests.length}</strong><span>Pruebas planificadas</span></div><div class="stat"><strong>${vals.length}</strong><span>Simuladas</span></div><div class="stat"><strong>${pending+s.results.filter(x=>x.status==='No evaluado').length}</strong><span>Pendientes / omitidas</span></div></div><h2>Resultados por movimiento</h2><div style="overflow-x:auto"><table><thead><tr><th>Articulación</th><th>Movimiento</th><th>Lado</th><th>ROM máximo*</th><th>Promedio*</th><th>Estado</th></tr></thead><tbody>${s.results.map(r=>`<tr><td>${esc(r.joint)}</td><td>${esc(r.name)}</td><td>${esc(r.side)}</td><td>${r.max==null?'—':r.max+'°'}</td><td>${r.average==null?'—':r.average+'°'}</td><td>${esc(r.status)}</td></tr>`).join('')}${s.tests.slice(s.results.length).map(r=>`<tr><td>${esc(r.joint)}</td><td>${esc(r.name)}</td><td>${esc(r.side)}</td><td>—</td><td>—</td><td>Pendiente</td></tr>`).join('')}</tbody></table></div><h2>Comparación bilateral</h2>${bilateral(s)}<p class="tiny muted">* Datos ficticios generados para probar la interfaz. No son resultados de una cámara ni mediciones clínicas.</p><div class="footeractions no-print">${s.status==='Pendiente'?`<button class="btn primary" onclick="resumeSession('${s.id}')">Retomar evaluación →</button>`:''}<button class="btn soft" onclick="exportCSV('${s.id}')">↓ Exportar CSV</button><button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button><button class="btn" onclick="compareView()">Comparar sesiones</button><button class="btn" onclick="renameSession('${s.id}')">Editar nombre</button></div></div>`)}function bilateral(s){let rows=[];for(let r of s.results){if(r.side!=='Derecha'||r.max==null)continue;let left=s.results.find(x=>x.moveId===r.moveId&&x.side==='Izquierda'&&x.max!=null);if(left)rows.push(`<tr><td>${esc(r.name)} (${esc(r.joint)})</td><td>${r.max}°</td><td>${left.max}°</td><td>${Math.abs(r.max-left.max)}°</td></tr>`)}return rows.length?`<table><thead><tr><th>Movimiento</th><th>Derecha</th><th>Izquierda</th><th>Diferencia absoluta</th></tr></thead><tbody>${rows.join('')}</tbody></table>`:'<p class="muted">No hay pares bilaterales comparables registrados.</p>'}function resumeSession(id){session=db.sessions.find(s=>s.id===id);index=session.results.length;rep=0;reptimes=[];assessmentView()}function renameSession(id){let s=db.sessions.find(x=>x.id===id);let v=prompt('Nombre o código de la evaluación:',s.label||'');if(v===null)return;s.label=v;save();resultsView(id)}function exportCSV(id){let s=db.sessions.find(x=>x.id===id);let rows=[['Fecha','Identificación','Articulación','Movimiento','Lado','Repetición','ROM máximo simulado (°)','ROM previo a alerta simulado (°)','Duración simulada (s)','Estado']];s.results.forEach(r=>{if(!r.repetitions.length)rows.push([s.created,s.label,r.joint,r.name,r.side,'','','','',r.status]);else r.repetitions.forEach(p=>rows.push([s.created,s.label,r.joint,r.name,r.side,p.rep,p.rom,p.pre,p.duration,r.status]))});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Happy_Feets_'+id+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function compareView(){let opts=db.sessions.map(s=>`<label class="checkitem"><input type="checkbox" class="compare" value="${s.id}"><span>${esc(s.label||'Sin nombre')} · ${new Date(s.created).toLocaleDateString('es-CL')}</span></label>`).join('');html(`<div class="headrow"><h1>Comparación histórica</h1><button class="btn" onclick="historyView()">← Historial</button></div><div class="card"><p>Selecciona al menos dos evaluaciones que correspondan a la misma persona. Solo se comparan pruebas equivalentes.</p><div class="checklist">${opts||'No hay evaluaciones guardadas.'}</div><div class="footeractions"><button class="btn primary" onclick="renderComparison()">Comparar seleccionadas</button></div><div id="compareResult"></div></div>`)}function renderComparison(){let ids=[...document.querySelectorAll('.compare:checked')].map(e=>e.value);if(ids.length<2){$('compareResult').innerHTML='<p class="warning">Selecciona al menos dos evaluaciones.</p>';return}let ss=db.sessions.filter(s=>ids.includes(s.id)).sort((a,b)=>a.created.localeCompare(b.created));let keys=[...new Set(ss.flatMap(s=>s.results.filter(r=>r.max!=null).map(r=>r.moveId+':'+r.side)))];let lines=keys.map(k=>{let values=ss.map(s=>s.results.find(r=>r.moveId+':'+r.side===k&&r.max!=null));if(values.filter(Boolean).length<2)return '';let r=values.find(Boolean);return `<tr><td>${esc(r.joint)} · ${esc(r.name)} · ${esc(r.side)}</td>${values.map(v=>`<td>${v?v.max+'°':'—'}</td>`).join('')}</tr>`}).filter(Boolean);$('compareResult').innerHTML=`<h2>Resultados comparables</h2>${lines.length?`<div style="overflow-x:auto"><table><thead><tr><th>Movimiento</th>${ss.map(s=>`<th>${new Date(s.created).toLocaleDateString('es-CL')}<br>${esc(s.label||'Sin nombre')}</th>`).join('')}</tr></thead><tbody>${lines.join('')}</tbody></table></div>`:'<p class="muted">No hay movimientos equivalentes con resultados en al menos dos sesiones.</p>'}<p class="tiny muted">Los resultados son estimaciones experimentales. Compara únicamente protocolos equivalentes de una misma persona.</p>`}

function hfPoseIllustration(t,goal){
 const id=t.moveId,front=['ha','hd'].includes(id),side=t.side==='Izquierda'?-1:1;
 const p=(x,y)=>[x,y],hip=front?p(110,125):p(104,125);
 let knee=front?p(124,193):p(112,193),ankle=front?p(125,265):p(112,265);
 if(id==='ke'){knee=p(161,128);ankle=goal?p(218,127):p(164,191)}
 if(goal){
  if(id==='hf'){knee=p(179,130);ankle=p(179,195)}
  if(id==='he'){knee=p(58,164);ankle=p(45,232)}
  if(id==='ha'){knee=p(174,179);ankle=p(210,250)}
  if(id==='hd'){knee=p(73,186);ankle=p(60,255)}
  if(id==='kf'){knee=p(113,194);ankle=p(57,161)}
  if(id==='df'){knee=p(151,177);ankle=p(117,263)}
  if(id==='fpb'||id==='fpu'){knee=p(113,184);ankle=p(114,252)}
 }
 const flip=side<0&&!front?'translate(220 0) scale(-1 1)':'';
 const limb=(x1,y1,x2,y2,color,w)=>'<path d="M'+x1+' '+y1+' L'+x2+' '+y2+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round"/>';
 const body='#335d5b',active='#0e9b86';
 const otherK=front?p(91,193):p(93,193),otherA=front?p(89,265):p(93,265);
 const foot=(a,activeLeg)=>'<path d="M'+a[0]+' '+a[1]+' l'+(front?9:24)+' 0" stroke="'+(activeLeg?active:body)+'" stroke-width="9" stroke-linecap="round"/>';
 const torso='<path d="M100 58 Q86 73 90 96 L94 124 Q108 136 119 123 L122 96 Q123 72 110 58 Z" fill="#74bcb2" stroke="#335d5b" stroke-width="2"/>';
 const figure='<circle cx="105" cy="38" r="18" fill="#edbd9a" stroke="#335d5b" stroke-width="2"/><path d="M88 33 Q89 12 108 16 Q124 18 124 38 L117 28 Q103 23 89 35Z" fill="#293d3d"/>'+torso+
 limb(94,74,74,124,body,12)+limb(118,75,134,122,body,12)+
 limb(98,126,otherK[0],otherK[1],body,13)+limb(otherK[0],otherK[1],otherA[0],otherA[1],body,12)+foot(otherA,false)+
 limb(110,126,knee[0],knee[1],active,14)+limb(knee[0],knee[1],ankle[0],ankle[1],active,12)+foot(ankle,true)+
 '<circle cx="'+knee[0]+'" cy="'+knee[1]+'" r="5" fill="#fff" stroke="'+active+'" stroke-width="3"/>';
 const arrow=goal?'<path d="M166 231 Q205 193 198 147" fill="none" stroke="#c68c20" stroke-width="3" stroke-dasharray="6 5"/><path d="M191 154 L198 145 L204 155" fill="none" stroke="#c68c20" stroke-width="3"/>':'';
 return '<svg viewBox="0 0 220 295" role="img" aria-label="'+(goal?'Posición objetivo':'Posición inicial')+' para '+esc(t.name)+'" style="width:100%;height:230px;max-width:100%;display:block;margin:auto"><rect x="1" y="1" width="218" height="293" rx="12" fill="#f4f8f7"/><path d="M15 279 H205" stroke="#b3c9c6" stroke-width="2"/><g transform="'+flip+'">'+figure+arrow+'</g></svg>';
}

 if(!images&&!description)return assessmentView();
 const instructions={hf:'De pie y de perfil, eleva la rodilla hacia delante mediante flexión de cadera; mantén el tronco estable. Se permite flexionar la rodilla.',he:'De pie y de perfil, lleva la pierna hacia atrás evitando arquear excesivamente la zona lumbar.',ha:'De pie y de frente, separa lateralmente la pierna sin inclinar el tronco ni desplazar excesivamente la pelvis.',hd:'De pie y de frente, cruza la pierna por delante del cuerpo sin girar la pelvis.',kf:'De pie y de perfil, flexiona la rodilla llevando el talón hacia atrás, evitando desplazar excesivamente el muslo.',ke:'Con el muslo elevado y la rodilla inicialmente flexionada, extiende la rodilla sin bajar el muslo.',df:'De perfil, con el pie apoyado, desplaza la rodilla hacia delante sin levantar el talón.',fpb:'De pie, eleva ambos talones de forma controlada y vuelve a apoyarlos.',fpu:'De pie, eleva el talón de la pierna evaluada; utiliza apoyo estable si es necesario.'};
 const diagram=images?'<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0"><div class="tip" style="text-align:center"><strong>Posición inicial</strong>'+hfPoseIllustration(t,false)+'</div><div class="tip" style="text-align:center"><strong>Posición objetivo</strong>'+hfPoseIllustration(t,true)+'</div></div><p class="tiny muted">Esquemas anatómicos orientativos en desarrollo; no representan un rango obligatorio ni sustituyen instrucciones profesionales.</p>':'';
 html('<div class="headrow"><div><span class="eyebrow muted">Preparación · Prueba '+(index+1)+' de '+session.tests.length+'</span><h1>'+esc(t.joint)+' · '+esc(t.name)+' · '+esc(t.side)+'</h1></div></div><div class="card" style="max-width:780px;margin:auto"><h2>Antes de comenzar</h2>'+diagram+(description?'<p>'+esc(instructions[t.moveId]||'Realiza el movimiento de manera lenta y controlada.')+'</p>':'')+'<p class="muted">Al pulsar comenzar se iniciarán la cámara y la calibración automáticamente.</p><button class="btn primary" onclick="assessmentView()">Estoy listo · Comenzar →</button> <button class="btn" onclick="hfSaveProgress()">Guardar y salir</button></div>');
}
function hfLoadTest(){let t=session.tests[index],frame=document.getElementById('hfEngine');if(!t||!frame)return;hfLatest=null;frame.srcdoc=hfEngineHtml();frame.onload=()=>{try{let d=frame.contentDocument;d.getElementById('movement').value=HF_MOVES[t.moveId];d.getElementById('side').value=t.side==='Izquierda'?'left':'right';let target=d.getElementById('target'),reps=t.reps; if(![...target.options].some(o=>+o.value===reps)){let opt=d.createElement('option');opt.value=String(reps);opt.textContent=String(reps);target.appendChild(opt)}target.value=String(reps);let threshold=d.getElementById('threshold');if(threshold){const angle=Math.max(3,Math.min(45,+db.settings.compensationAngle||10));if(![...threshold.options].some(o=>+o.value===angle)){let opt=d.createElement('option');opt.value=String(angle);opt.textContent=String(angle)+'°';threshold.appendChild(opt)}threshold.value=String(angle)}d.getElementById('movement').dispatchEvent(new Event('change'));d.getElementById('target').dispatchEvent(new Event('change'));hfAutoPrepare(frame);}catch(e){console.warn('No se pudo preparar prueba',e)}}}
function hfAutoPrepare(frame){
  const d=frame.contentDocument;if(!d)return;
  const status=document.getElementById('hfAutoStatus');
  const setStatus=t=>{if(status)status.textContent=t};
  setStatus('Solicitando acceso a la cámara…');
  d.getElementById('start')?.click();
  let step=0,tries=0;
  const poll=setInterval(()=>{
    if(!frame.isConnected||!frame.contentDocument){clearInterval(poll);return}
    const doc=frame.contentDocument;
    if(step===0&&!doc.getElementById('detect')?.disabled){step=1;setStatus('Cámara activa. Iniciando detección corporal…');doc.getElementById('detect').click()}
    if(step===1&&!doc.getElementById('calibrate')?.disabled){step=2;setStatus('Detección activa. Preparando calibración automática…');doc.getElementById('calibrate').click();setStatus('Calibración iniciada. Colócate en la posición inicial y espera a que se estabilice la postura.')}
    if(step===2||++tries>120){clearInterval(poll);if(step!==2)setStatus('No se pudo iniciar automáticamente. Revisa el permiso de cámara y utiliza los controles del evaluador.')}
  },500);
}
window.addEventListener('message',e=>{if(e.source!==document.getElementById('hfEngine')?.contentWindow||e.data?.source!=='happyfeets-engine-v12')return;hfLatest=e.data;let label=document.getElementById('hfCaptured');if(label)label.textContent=`${e.data.records.length} repeticiones registradas por la cámara`});
function assessmentView(){stopTimer();let t=session.tests[index];if(!t){finishSession('Completada');return}let pct=Math.round(100*index/session.tests.length);html(`<div class="headrow"><div><span class="eyebrow muted">${esc(session.label||'Evaluación en curso')}</span><h1>${esc(t.joint)} · ${esc(t.name)}</h1><span class="pill">${esc(t.side)} · Vista ${esc(t.view.toLowerCase())}</span></div><button class="btn" onclick="hfSaveProgress()">Guardar y salir</button></div><div class="muted tiny">Prueba ${index+1} de ${session.tests.length} · ${pct}% completado</div><div class="stepper"><div style="width:${pct}%"></div></div><div class="card"><p class="muted">La cámara, la detección y la calibración se iniciarán automáticamente cuando el navegador lo permita. Puedes recalibrar o detener la cámara con los controles del evaluador. Las mediciones son experimentales y no están validadas clínicamente.</p><div id="hfAutoStatus" class="tip" role="status">Preparando evaluador…</div><div id="hfCaptured" class="pill">Esperando mediciones</div><iframe id="hfEngine" title="Evaluador Happy Feets con cámara" allow="camera; microphone" style="display:block;width:100%;height:1190px;border:1px solid var(--line);border-radius:14px;background:#f2f8f6;margin-top:12px"></iframe><div class="footeractions"><button class="btn primary" onclick="hfSaveAndNext()">Guardar resultados y siguiente prueba →</button><button class="btn" onclick="hfSkip()">Omitir prueba</button><button class="btn soft" onclick="hfSaveProgress()">Guardar y salir</button></div><p class="muted tiny">Los resultados se transfieren desde el evaluador a esta sesión al pulsar «Guardar resultados». No cierres la prueba antes de guardar. Si no hubo repeticiones, quedará como «No evaluado».</p></div>`);hfLoadTest()}
function hfReportGraph(s){
 return s.results.map(r=>{
 const reps=r.repetitions.filter(p=>p.trace?.length>1);if(!reps.length)return '';
 const max=Math.max(10,Math.ceil((Math.max(...reps.flatMap(p=>p.trace.map(v=>Number(v.y)||0)),0)+5)/10)*10);
 const maxT=Math.max(1,...reps.map(p=>p.trace[p.trace.length-1].t));
 const L=65,R=750,T=20,B=225,px=t=>L+Math.max(0,Math.min(maxT,t))/maxT*(R-L),py=y=>B-Math.max(0,Math.min(max,y))/max*(B-T);
 let lines='<line x1="65" y1="20" x2="65" y2="225" stroke="#78968f"/><line x1="65" y1="225" x2="750" y2="225" stroke="#78968f"/>';
 for(let i=0;i<=5;i++){const y=B-(B-T)*i/5,t=maxT*i/5,x=px(t);lines+='<line x1="65" y1="'+y+'" x2="750" y2="'+y+'" stroke="#dbe8e4"/><text x="55" y="'+(y+4)+'" text-anchor="end" font-size="12">'+(max*i/5).toFixed(0)+'</text><line x1="'+x+'" y1="20" x2="'+x+'" y2="225" stroke="#edf2f0"/><text x="'+x+'" y="243" text-anchor="middle" font-size="12">'+t.toFixed(1)+'</text>'}
 lines+='<text x="400" y="266" text-anchor="middle" font-size="13">Tiempo (s)</text><text x="17" y="125" transform="rotate(-90 17 125)" text-anchor="middle" font-size="13">ROM (°)</text>';
 const colors=['#087f72','#2563eb','#8b5cf6','#c026d3','#ea580c','#0f766e'];
 reps.forEach((p,i)=>{const color=colors[i%colors.length];lines+='<polyline fill="none" stroke="'+color+'" stroke-width="2.5" points="'+p.trace.map(v=>px(v.t).toFixed(1)+','+py(v.y).toFixed(1)).join(' ')+'"/><text x="'+(75+(i%6)*115)+'" y="'+(286+Math.floor(i/6)*17)+'" font-size="12" fill="'+color+'">● Rep. '+p.rep+'</text>';if(p.alertTime!=null&&p.alert&&p.alert!=='Sin alerta')lines+='<circle cx="'+px(p.alertTime)+'" cy="'+py(p.firstAt??p.pre??0)+'" r="5" fill="#f59e0b"/>'});
 return '<div style="break-inside:avoid;page-break-inside:avoid;margin:20px 0"><strong>'+esc(r.name)+' · '+esc(r.side)+'</strong><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 '+(305+Math.floor((reps.length-1)/6)*17)+'" width="780" style="display:block;max-width:100%;height:auto;background:#f7fbfa;border:1px solid #ddd">'+lines+'</svg></div>';
 }).join('')||'<p>Sin curvas guardadas en esta evaluación.</p>';
}
function hfMakeResult(t){let rr=hfLatest?.records||[];let max=rr.length?Math.max(...rr.map(r=>r.peak)):null;return {...t,status:rr.length?'Evaluada (experimental)':'No evaluado',max,average:rr.length?rr.reduce((s,r)=>s+r.peak,0)/rr.length:null,baseline:hfLatest?.baseline??null,repetitions:rr.map((r,i)=>({rep:i+1,rom:r.peak,pre:r.before??null,duration:r.duration,angle:r.angle,alert:r.alert||'Sin alerta',quality:r.quality,trace:r.trace||[],alertTime:r.alertTime??null,firstAt:r.firstAt??null}))}}
function hfSaveAndNext(){let t=session.tests[index];session.results.push(hfMakeResult(t));index++;hfLatest=null;if(index>=session.tests.length)finishSession('Completada');else hfPreparationView()}
function hfSkip(){let t=session.tests[index];session.results.push({...t,status:'No evaluado',max:null,average:null,repetitions:[]});index++;hfLatest=null;if(index>=session.tests.length)finishSession('Finalizada parcialmente');else hfPreparationView()}
function hfSaveProgress(){if(!session)return home();session.status='Pendiente';session.updated=new Date().toISOString();let j=db.sessions.findIndex(s=>s.id===session.id);if(j>=0)db.sessions[j]=session;else db.sessions.push(session);save();home()}
function home(){stopTimer();html(`<div class="hero"><div><span class="eyebrow">Movilidad funcional · Extremidades inferiores</span><h1>Conoce tu movimiento.<br>Explora tu progreso.</h1><p>Evalúa tobillo, rodilla y cadera con cámara, recorridos guiados y resultados por repetición.</p><button class="btn" onclick="configure('full')">Comenzar evaluación completa →</button></div><div class="heroart">🦵</div></div><section class="section"><h2>¿Qué deseas evaluar?</h2><div class="grid"><article class="card choice" onclick="configure('full')"><div class="emoji">📋</div><h3>Evaluación completa</h3><p>Todos los movimientos, de tobillo a cadera.</p></article><article class="card choice" onclick="configure('custom')"><div class="emoji">🎛️</div><h3>Personalizada</h3><p>Elige movimientos y lados. Orden automático.</p></article><article class="card choice" onclick="configure('single')"><div class="emoji">🎯</div><h3>Individual</h3><p>Una prueba específica, sin recorrido adicional.</p></article></div></section><section class="section"><div class="headrow"><h2>Evaluaciones recientes</h2><button class="btn small" onclick="historyView()">Ver historial →</button></div>${db.sessions.length?db.sessions.slice().reverse().slice(0,3).map(s=>`<div class="card" style="margin-bottom:9px"><strong>${esc(s.label||'Evaluación sin nombre')}</strong><div class="muted tiny">${new Date(s.created).toLocaleString('es-CL')} · ${esc(s.status)} · ${s.results.length} pruebas registradas</div><button class="btn small soft" style="margin-top:8px" onclick="resultsView('${s.id}')">Ver resultados</button></div>`).join(''):'<div class="card muted">Aún no hay evaluaciones guardadas.</div>'}</section><p class="tiny muted section">Mediciones experimentales por cámara 2D. No aptas para diagnóstico clínico.</p>`)}
function resultsView(id){stopTimer();let s=db.sessions.find(x=>x.id===id);if(!s)return historyView();html(`<div class="headrow"><div><span class="eyebrow muted">Resultados · ${esc(s.status)}</span><h1>${esc(s.label||'Evaluación sin nombre')}</h1><p class="muted">${new Date(s.created).toLocaleString('es-CL')} · ${esc(s.description||'Sin descripción')}</p></div><button class="btn" onclick="historyView()">← Historial</button></div><div class="card"><h2>Resultados por movimiento</h2><div style="overflow-x:auto"><table><thead><tr><th>Articulación</th><th>Movimiento</th><th>Lado</th><th>Máximo estimado</th><th>Promedio</th><th>Estado</th></tr></thead><tbody>${s.results.map(r=>`<tr><td>${esc(r.joint)}</td><td>${esc(r.name)}</td><td>${esc(r.side)}</td><td>${r.max==null?'—':r.max.toFixed(1)+(r.moveId.startsWith('fp')?' (indicador)':'°')}</td><td>${r.average==null?'—':r.average.toFixed(1)}</td><td>${esc(r.status)}</td></tr>`).join('')}${s.tests.slice(s.results.length).map(r=>`<tr><td>${esc(r.joint)}</td><td>${esc(r.name)}</td><td>${esc(r.side)}</td><td>—</td><td>—</td><td>Pendiente</td></tr>`).join('')}</tbody></table></div><h2>Gráficos comparativos de repeticiones</h2><p class="muted tiny">Curvas de ROM por repetición. Los puntos naranjas indican alertas.</p>${hfReportGraph(s)}<h2>Detalle de repeticiones</h2><div style="overflow-x:auto"><table><thead><tr><th>Prueba</th><th>Rep.</th><th>Máximo</th><th>Previo a alerta</th><th>Alerta</th><th>Duración</th></tr></thead><tbody>${s.results.flatMap(r=>r.repetitions.map(p=>`<tr><td>${esc(r.name)} · ${esc(r.side)}</td><td>${p.rep}</td><td>${Number(p.rom).toFixed(1)}</td><td>${p.pre==null?'No determinable':Number(p.pre).toFixed(1)}</td><td>${esc(p.alert||'Sin alerta')}</td><td>${Number(p.duration).toFixed(1)} s</td></tr>`)).join('')||'<tr><td colspan="6">Sin repeticiones registradas</td></tr>'}</tbody></table></div><p class="muted tiny">Mediciones estimadas por cámara, no validadas clínicamente. Flexión plantar: indicador funcional, no grados de ROM.</p><div class="footeractions">${s.status==='Pendiente'?`<button class="btn primary" onclick="resumeSession('${s.id}')">Retomar evaluación →</button>`:''}<button class="btn soft" onclick="exportCSV('${s.id}')">Exportar CSV</button><button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button><button class="btn" onclick="renameSession('${s.id}')">Editar nombre</button></div></div>`)}
function exportCSV(id){let s=db.sessions.find(x=>x.id===id);let rows=[['Fecha','Identificación','Articulación','Movimiento','Lado','Repetición','Máximo estimado','Previo a alerta','Ángulo al máximo','Tipo de alerta','Duración segundos','Calidad','Estado']];s.results.forEach(r=>{if(!r.repetitions.length)rows.push([s.created,s.label,r.joint,r.name,r.side,'','','','','','','',r.status]);else r.repetitions.forEach(p=>rows.push([s.created,s.label,r.joint,r.name,r.side,p.rep,p.rom,p.pre??'',p.angle??'',p.alert??'',p.duration,p.quality??'',r.status]))});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Happy_Feets_'+id+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

if(db.settings.onboardingComplete){home()}else{welcomeView(0)}
</script></body></html>
